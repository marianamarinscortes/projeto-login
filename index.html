<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
</head>
<body>
    <main>
        <img src="imagens/metal.jpg" alt="Prédio">
        <h1>Login</h1>
        <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
        <form action="login.py" method="post">
            <div class="caixa">
                <span id="pessoa" class="material-symbols-outlined">person</span>
                <input type="email" name="email" id="iemail" required placeholder="seu e-mail">
            </div>
            <div class="caixa">
                <span id="chave" class="material-symbols-outlined">key</span>
                <input type="password" name="password" id="ipassword" required placeholder="sua senha">
            </div>
            <input type="submit" id="ientrar" value="Entrar">
            <a href="esqueci.html">Esqueci a senha</a>
        </form>
    </main>
</body>
</html>
